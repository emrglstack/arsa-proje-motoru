<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATRON - Mimari Etüt & Katalog</title>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --primary: #721c24;
            --primary-dark: #4a1016;
            --bg-dark: #0f1115;
            --panel-bg: #1a1d24;
            --border: #2a2e39;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 40px; }
        
        .mobile-header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 14px;
            text-align: center;
            border-bottom: 2px solid #a72834;
            position: sticky; top: 0; z-index: 100;
        }
        .mobile-header h1 { font-size: 15px; color: white; }
        .mobile-header span { font-size: 10px; color: #f8d7da; }

        .app-container {
            max-width: 600px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 10px;
        }
        .card {
            background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px;
        }
        .card h2 {
            font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px;
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }

        .input-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .input-group input, .input-group select {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: white; padding: 7px; border-radius: 5px; font-size: 11px;
        }
        .btn {
            padding: 9px; border: none; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center;
        }
        .btn-primary { background: var(--primary); color: white; flex: 1; }
        .btn-secondary { background: #323642; color: white; flex: 1; }
        .btn-accent { background: var(--accent); color: #052e16; width: 100%; }

        .canvas-box {
            width: 100%; height: 360px; background: #101216; border-radius: 6px; position: relative; overflow: hidden; border: 1px solid var(--border);
        }
        canvas { width: 100%; height: 100%; display: block; }
        #threeContainer { width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: none; }

        .view-switch { display: flex; gap: 6px; margin-bottom: 6px; }
        .mode-btn {
            flex: 1; background: #2b303b; color: #d1d5db; border: 1px solid var(--border); padding: 7px; border-radius: 5px; font-size: 11px; font-weight: 600;
        }
        .mode-btn.active { background: var(--primary); color: white; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
        th, td { padding: 5px; border-bottom: 1px solid var(--border); text-align: left; }
        th { color: var(--text-muted); }
        .summary-box {
            background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent); padding: 6px; border-radius: 5px; font-size: 11px; display: flex; justify-content: space-between; margin-top: 6px;
        }
        .edge-row {
            display: grid; grid-template-columns: 40px 1fr 1fr 45px; gap: 4px; align-items: center; margin-bottom: 5px; font-size: 11px;
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <h1>TOCO MİMARİ ETÜT</h1>
        <span>Mobil Prototip v0.6 (Özelleştirilebilir Çekmeler & Proje Tipi)</span>
    </header>

    <div class="app-container">
        <!-- 1. Parsel Yükleme -->
        <div class="card">
            <h2>1. Parsel Verisi (TKGM GeoJSON)</h2>
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <label for="geojsonInput" class="btn btn-primary" style="display:block; cursor:pointer; flex:1; text-align:center; padding:10px;">GeoJSON Dosyası Yükle</label>
                <input type="file" id="geojsonInput" accept=".json,.geojson" hidden>
                <button id="loadSampleBtn" class="btn btn-secondary">Örnek Parsel</button>
            </div>
            <div class="grid-2">
                <div class="input-group"><label>Mahalle</label><input type="text" id="mahalleInput" value="-" readonly></div>
                <div class="input-group"><label>Ada / Parsel</label><input type="text" id="adaParselInput" value="-" readonly></div>
            </div>
        </div>

        <!-- 2. Proje Tipi & Kenar Çekmeleri -->
        <div class="card">
            <h2>2. Proje Tipi & Kenar Çekmeleri</h2>
            <div class="grid-2" style="margin-bottom: 8px;">
                <div class="input-group">
                    <label>Proje Tipi</label>
                    <select id="projectType">
                        <option value="villa">Müstakil Villa</option>
                        <option value="daire">Apartman / Daire</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Daire / Oda Tipi</label>
                    <select id="daireTipiSelect">
                        <option value="2+1">2+1 Konsept</option>
                        <option value="3+1">3+1 Konsept</option>
                    </select>
                </div>
            </div>
            
            <div id="edgesList" style="max-height:160px; overflow-y:auto; margin-bottom:8px;">
                <div style="color:var(--text-muted); text-align:center; font-size:11px;">Önce parsel yükleyin</div>
            </div>
            
            <button id="calculateBtn" class="btn btn-accent" disabled>Çekme Sınırını ve Taslağı Hesapla</button>
        </div>

        <!-- 3. Görselleştirme -->
        <div class="card">
            <div class="view-switch">
                <button id="mode2dBtn" class="mode-btn active">2D Vaziyet & Yerleşim</button>
                <button id="mode3dBtn" class="mode-btn" disabled>3D Maket</button>
            </div>
            <div class="canvas-box" id="canvasContainer">
                <canvas id="planCanvas"></canvas>
                <div id="threeContainer"></div>
            </div>
        </div>

        <!-- 4. Katalog Özeti -->
        <div class="card">
            <h2>Oda Dağılımı & Alanlar</h2>
            <table>
                <thead><tr><th>Mahal</th><th>Alan</th></tr></thead>
                <tbody id="roomsTableBody">
                    <tr><td colspan="2" style="text-align:center; color:var(--text-muted);">Plan bekleniyor</td></tr>
                </tbody>
            </table>
            <div class="summary-box">
                <span>Net Oturum: <strong id="netAlanTxt">0 m²</strong></span>
                <span>Toplam Brüt: <strong id="brutAlanTxt">0 m²</strong></span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('planCanvas');
        const ctx = canvas.getContext('2d');
        const threeContainer = document.getElementById('threeContainer');

        let currentPolygon = null;
        let setbackPolygon = null;
        let edgesData = [];
        let generatedRooms = [];
        let activeMode = '2d';
        let scene, camera, renderer, controls;

        const sampleGeoJSON = {
            "type": "Feature",
            "properties": { "mahalle": "Şarköy Mah.", "ada": "142", "parsel": "8" },
            "geometry": {
                "type": "Polygon",
                "coordinates": [[
                    [26.9680, 39.4980],
                    [26.9688, 39.4981],
                    [26.9689, 39.4973],
                    [26.9681, 39.4972],
                    [26.9680, 39.4980]
                ]]
            }
        };

        function resizeCanvas() {
            const parent = document.getElementById('canvasContainer');
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            if (renderer && camera) {
                camera.aspect = parent.clientWidth / parent.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(parent.clientWidth, parent.clientHeight);
            }
            if (activeMode === '2d') drawScene2D();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        document.getElementById('loadSampleBtn').addEventListener('click', () => loadParcel(sampleGeoJSON));

        document.getElementById('geojsonInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const raw = JSON.parse(event.target.result);
                    let feat = raw.type === 'FeatureCollection' ? raw.features[0] : raw;
                    if (feat && feat.geometry) loadParcel(feat);
                    else alert("Geçersiz GeoJSON dosyası!");
                } catch(err) { alert("Dosya okunamadı!"); }
            };
            reader.readAsText(file);
        });

        function loadParcel(feature) {
            if (feature.geometry.type === 'MultiPolygon') {
                feature.geometry.type = 'Polygon';
                feature.geometry.coordinates = feature.geometry.coordinates[0];
            }
            currentPolygon = feature;
            setbackPolygon = null;

            const props = feature.properties || {};
            document.getElementById('mahalleInput').value = props.mahalle || props.MAHALLE || "Merkez";
            document.getElementById('adaParselInput').value = (props.ada || "1") + " / " + (props.parsel || "1");

            // Kenarları çıkar ve UI oluştur (Varsayılan: 1. kenar Yol 5m, diğerleri Komşu 3m)
            const coords = feature.geometry.coordinates[0];
            edgesData = [];
            for (let i = 0; i < coords.length - 1; i++) {
                const p1 = turf.point(coords[i]), p2 = turf.point(coords[i+1]);
                const len = turf.distance(p1, p2, {units: 'kilometers'}) * 1000;
                edgesData.push({
                    index: i,
                    length: len,
                    type: i === 0 ? 'yol' : 'komsu',
                    setback: i === 0 ? 5 : 3
                });
            }

            renderEdgesUI();
            document.getElementById('calculateBtn').disabled = false;
            drawScene2D();
            alert("Parsel yüklendi! Kenar çekme mesafelerini kontrol edebilirsiniz.");
        }

        function renderEdgesUI() {
            const container = document.getElementById('edgesList');
            container.innerHTML = '';
            edgesData.forEach((edge, idx) => {
                const div = document.createElement('div');
                div.className = 'edge-row';
                div.innerHTML = `
                    <span><strong>K${idx+1}</strong> (${edge.length.toFixed(1)}m)</span>
                    <select onchange="updateEdgeType(${idx}, this.value)" style="font-size:10px; background:#0f1115; color:white; border:1px solid var(--border); padding:5px; border-radius:4px;">
                        <option value="yol" ${edge.type==='yol'?'selected':''}>Yol (5m)</option>
                        <option value="komsu" ${edge.type==='komsu'?'selected':''}>Komşu (3m)</option>
                        <option value="bitisik" ${edge.type==='bitisik'?'selected':''}>Bitişik (0m)</option>
                    </select>
                    <input type="number" step="0.5" min="0" value="${edge.setback}" onchange="edgesData[${idx}].setback = parseFloat(this.value)||0" style="background:#0f1115; color:white; border:1px solid var(--border); padding:5px; border-radius:4px; text-align:center;">
                    <span style="font-size:10px; color:var(--text-muted);">Çekme</span>
                `;
                container.appendChild(div);
            });
        }

        window.updateEdgeType = (idx, val) => {
            edgesData[idx].type = val;
            edgesData[idx].setback = val === 'yol' ? 5 : (val === 'komsu' ? 3 : 0);
            renderEdgesUI();
        };

        loadParcel(sampleGeoJSON);

        document.getElementById('calculateBtn').addEventListener('click', () => {
            if (!currentPolygon) return;
            try {
                // Her kenarın kendi çekme mesafesine göre güvenli poligon oluşturma yaklaşımı
                const coords = currentPolygon.geometry.coordinates[0];
                const center = turf.center(currentPolygon).geometry.coordinates;
                const mLat = 111320, mLon = 111320 * Math.cos(center[1] * Math.PI / 180);

                let areaSum = 0;
                const localPts = coords.slice(0, -1).map(c => ({ x: (c[0] - center[0]) * mLon, y: (c[1] - center[1]) * mLat }));
                for (let i = 0; i < localPts.length; i++) {
                    const j = (i + 1) % localPts.length;
                    areaSum += (localPts[j].x - localPts[i].x) * (localPts[j].y + localPts[i].y);
                }
                const isClockwise = areaSum > 0;

                const offsetLines = localPts.map((p1, i) => {
                    const p2 = localPts[(i + 1) % localPts.length];
                    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy);
                    if (len === 0) return { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
                    const nx = isClockwise ? dy / len : -dy / len;
                    const ny = isClockwise ? -dx / len : dx / len;
                    const d = edgesData[i].setback;
                    return { x1: p1.x + nx * d, y1: p1.y + ny * d, x2: p2.x + nx * d, y2: p2.y + ny * d };
                });

                const newLocalPts = offsetLines.map((l2, i) => {
                    const l1 = offsetLines[(i - 1 + offsetLines.length) % offsetLines.length];
                    const denom = (l1.x1 - l1.x2) * (l2.y1 - l2.y2) - (l1.y1 - l1.y2) * (l2.x1 - l2.x2);
                    if (Math.abs(denom) < 1e-9) return { x: l2.x1, y: l2.y1 };
                    const t = ((l1.x1 - l2.x1) * (l2.y1 - l2.y2) - (l1.y1 - l2.y1) * (l2.x1 - l2.x2)) / denom;
                    return { x: l1.x1 + t * (l1.x2 - l1.x1), y: l1.y1 + t * (l1.y2 - l1.y1) };
                });

                const newGeoCoords = newLocalPts.map(p => [center[0] + p.x / mLon, center[1] + p.y / mLat]);
                newGeoCoords.push(newGeoCoords[0]);

                setbackPolygon = turf.polygon([newGeoCoords]);
                if (turf.area(setbackPolygon) <= 0) {
                    alert("Girilen çekme mesafeleri parsel için çok büyük!");
                    return;
                }

                generatePlan();
            } catch(e) {
                alert("Hesaplama hatası: " + e.message);
            }
        });

        function generatePlan() {
            const totalNet = turf.area(setbackPolygon);
            const pType = document.getElementById('projectType').value;
            const rType = document.getElementById('daireTipiSelect').value;

            // Proje tipine göre gerçekçi oranlar
            if (pType === 'villa') {
                generatedRooms = [
                    { id: 1, name: "Giriş / Antre", area: totalNet * 0.10, color: "#cbd5e1", rx: 0, ry: 0, rw: 0.3, rh: 0.3 },
                    { id: 2, name: "Salon & Mutfak (Amerikan)", area: totalNet * 0.45, color: "#e8dcc8", rx: 0.3, ry: 0, rw: 0.7, rh: 0.6 },
                    { id: 3, name: "Ebeveyn Yatak Odası", area: totalNet * 0.25, color: "#dfcbb2", rx: 0, ry: 0.3, rw: 0.3, rh: 0.7 },
                    { id: 4, name: "Ortak Banyo", area: totalNet * 0.10, color: "#cbd5e1", rx: 0.3, ry: 0.6, rw: 0.3, rh: 0.4 },
                    { id: 5, name: "Veranda / Teras", area: totalNet * 0.10, color: "#94a3b8", rx: 0.6, ry: 0.6, rw: 0.4, rh: 0.4 }
                ];
            } else {
                generatedRooms = rType === '2+1' ? [
                    { id: 1, name: "Salon", area: totalNet * 0.32, color: "#e8dcc8", rx: 0, ry: 0, rw: 0.5, rh: 0.6 },
                    { id: 2, name: "Yatak Odası", area: totalNet * 0.20, color: "#dfcbb2", rx: 0.5, ry: 0, rw: 0.5, rh: 0.3 },
                    { id: 3, name: "Çocuk Odası", area: totalNet * 0.16, color: "#e5d4be", rx: 0.5, ry: 0.3, rw: 0.5, rh: 0.3 },
                    { id: 4, name: "Mutfak", area: totalNet * 0.14, color: "#d8dee9", rx: 0, ry: 0.6, rw: 0.4, rh: 0.4 },
                    { id: 5, name: "Banyo", area: totalNet * 0.08, color: "#cbd5e1", rx: 0.4, ry: 0.6, rw: 0.3, rh: 0.4 },
                    { id: 6, name: "Antre / Hol", area: totalNet * 0.10, color: "#cbd5e1", rx: 0.7, ry: 0.6, rw: 0.3, rh: 0.4 }
                ] : [
                    { id: 1, name: "Salon", area: totalNet * 0.28, color: "#e8dcc8", rx: 0, ry: 0, rw: 0.5, rh: 0.5 },
                    { id: 2, name: "Ebeveyn Yatak", area: totalNet * 0.18, color: "#dfcbb2", rx: 0.5, ry: 0, rw: 0.5, ry: 0, rw: 0.5, rh: 0.3 },
                    { id: 3, name: "1. Çocuk Odası", area: totalNet * 0.13, color: "#e5d4be", rx: 0.5, ry: 0.3, rw: 0.25, rh: 0.3 },
                    { id: 4, name: "2. Çocuk Odası", area: totalNet * 0.13, color: "#e5d4be", rx: 0.75, ry: 0.3, rw: 0.25, rh: 0.3 },
                    { id: 5, name: "Mutfak", area: totalNet * 0.12, color: "#d8dee9", rx: 0, ry: 0.5, rw: 0.5, rh: 0.5 },
                    { id: 6, name: "Banyo", area: totalNet * 0.08, color: "#cbd5e1", rx: 0.5, ry: 0.6, rw: 0.25, rh: 0.4 },
                    { id: 7, name: "Antre", area: totalNet * 0.08, color: "#cbd5e1", rx: 0.75, ry: 0.6, rw: 0.25, rh: 0.4 }
                ];
            }

            const tbody = document.getElementById('roomsTableBody');
            tbody.innerHTML = '';
            generatedRooms.forEach(room => {
                tbody.innerHTML += `<tr><td><strong>${room.id}.</strong> ${room.name}</td><td>${room.area.toFixed(2)} m²</td></tr>`;
            });
            document.getElementById('netAlanTxt').innerText = `${totalNet.toFixed(2)} m²`;
            document.getElementById('brutAlanTxt').innerText = `${(totalNet * 1.15).toFixed(2)} m²`;

            document.getElementById('mode3dBtn').disabled = false;
            switchMode('2d');
        }

        function drawScene2D() {
            if (!currentPolygon) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bbox = turf.bbox(currentPolygon);
            const padding = 35;
            const latFactor = Math.cos(((bbox[1] + bbox[3]) / 2) * Math.PI / 180);
            const spanX = (bbox[2] - bbox[0]) * latFactor || 0.001;
            const spanY = (bbox[3] - bbox[1]) || 0.001;
            const scale = Math.min((canvas.width - padding * 2) / spanX, (canvas.height - padding * 2) / spanY);
            const center = [(bbox[0] + bbox[2]) / 2, (bbox[1] + bbox[3]) / 2];

            function toScreen(coord) {
                return {
                    x: canvas.width / 2 + (coord[0] - center[0]) * latFactor * scale,
                    y: canvas.height / 2 - (coord[1] - center[1]) * scale
                };
            }

            // Parsel Sınırı (Mavi)
            const coords = currentPolygon.geometry.coordinates[0];
            ctx.beginPath();
            coords.forEach((pt, i) => {
                const s = toScreen(pt);
                if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
            });
            ctx.lineWidth = 3; ctx.strokeStyle = '#3b82f6'; ctx.stroke();

            // Çekme Sınırı & İç Odalar (Yeşil)
            if (setbackPolygon) {
                const sCoords = setbackPolygon.geometry.coordinates[0];
                const screenPts = sCoords.map(toScreen);

                ctx.save();
                ctx.beginPath();
                screenPts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
                ctx.closePath();
                ctx.fillStyle = "rgba(16, 185, 129, 0.2)";
                ctx.fill();
                ctx.lineWidth = 2; ctx.strokeStyle = "#10b981"; ctx.stroke();

                if (generatedRooms.length > 0) {
                    ctx.clip();
                    const minX = Math.min(...screenPts.map(p => p.x)), maxX = Math.max(...screenPts.map(p => p.x));
                    const minY = Math.min(...screenPts.map(p => p.y)), maxY = Math.max(...screenPts.map(p => p.y));
                    const w = maxX - minX, h = maxY - minY;

                    generatedRooms.forEach(room => {
                        const x = minX + room.rx * w, y = minY + room.ry * h;
                        const rw = room.rw * w, rh = room.rh * h;
                        ctx.fillStyle = room.color; ctx.fillRect(x, y, rw, rh);
                        ctx.strokeStyle = "#111827"; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, rw, rh);

                        const cx = x + rw / 2, cy = y + rh / 2;
                        ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
                        ctx.fillStyle = "#111827"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center";
                        ctx.fillText(room.id, cx, cy + 3); ctx.textAlign = "left";
                    });
                }
                ctx.restore();
            }
        }

        document.getElementById('mode2dBtn').addEventListener('click', () => switchMode('2d'));
        document.getElementById('mode3dBtn').addEventListener('click', () => switchMode('3d'));

        function switchMode(mode) {
            activeMode = mode;
            document.getElementById('mode2dBtn').classList.toggle('active', mode === '2d');
            document.getElementById('mode3dBtn').classList.toggle('active', mode === '3d');
            if (mode === '2d') {
                canvas.style.display = 'block';
                threeContainer.style.display = 'none';
                drawScene2D();
            } else {
                canvas.style.display = 'none';
                threeContainer.style.display = 'block';
                build3DIsometricModel();
            }
        }

        function build3DIsometricModel() {
            if (typeof THREE === 'undefined') return;
            threeContainer.innerHTML = '';
            const w = threeContainer.clientWidth, h = threeContainer.clientHeight;

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf1f5f9);
            camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
            camera.position.set(10, 12, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(w, h);
            threeContainer.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            const planW = 9, planD = 7, startX = -planW / 2, startZ = -planD / 2;
            generatedRooms.forEach(room => {
                const rw = room.rw * planW, rd = room.rh * planD;
                const cx = startX + room.rx * planW + rw / 2, cz = startZ + room.ry * planD + rd / 2;
                const floor = new THREE.Mesh(new THREE.BoxGeometry(rw - 0.1, 0.15, rd - 0.1), new THREE.MeshStandardMaterial({ color: room.color }));
                floor.position.set(cx, 0.08, cz);
                scene.add(floor);
            });

            function animate() {
                if (activeMode !== '3d') return;
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }
    </script>
</body>
</html>
