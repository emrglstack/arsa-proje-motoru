<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PATRON - 2D Vaziyet Planı</title>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <style>
        :root {
            --primary: #721c24;
            --bg-dark: #0f1115;
            --panel-bg: #1a1d24;
            --border: #2a2e39;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); padding-bottom: 40px; }
        
        .mobile-header {
            background: linear-gradient(135deg, var(--primary), #4a1016);
            padding: 14px; text-align: center; border-bottom: 2px solid #a72834;
            position: sticky; top: 0; z-index: 100;
        }
        .mobile-header h1 { font-size: 15px; color: white; }
        .mobile-header span { font-size: 10px; color: #f8d7da; }

        .app-container { max-width: 600px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .card { background-color: var(--panel-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
        .card h2 { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .input-group label { display: block; font-size: 10px; color: var(--text-muted); margin-bottom: 2px; }
        .input-group input, .input-group select {
            width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: white; padding: 7px; border-radius: 5px; font-size: 11px;
        }
        .btn { padding: 9px; border: none; border-radius: 5px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn-primary { background: var(--primary); color: white; flex: 1; }
        .btn-secondary { background: #323642; color: white; flex: 1; }
        .btn-accent { background: var(--accent); color: #052e16; width: 100%; margin-top: 8px; }

        .canvas-box {
            width: 100%; height: 400px; background: #101216; border-radius: 6px; position: relative; overflow: hidden; border: 1px solid var(--border);
        }
        canvas { width: 100%; height: 100%; display: block; }

        .edge-row {
            display: grid; grid-template-columns: 45px 1fr 1fr; gap: 6px; align-items: center; margin-bottom: 6px; font-size: 11px;
        }
        .summary-box {
            background: rgba(16, 185, 129, 0.1); border: 1px solid var(--accent); padding: 8px; border-radius: 5px; font-size: 11px; display: flex; justify-content: space-between; margin-top: 8px;
        }
    </style>
</head>
<body>

    <header class="mobile-header">
        <h1>TOCO VAZİYET PLANLAMA</h1>
        <span>Ölçülü Kenar & Cephe Analizi</span>
    </header>

    <div class="app-container">
        <!-- 1. Parsel Yükleme -->
        <div class="card">
            <h2>1. Parsel Verisi (GeoJSON)</h2>
            <div style="display:flex; gap:6px; margin-bottom:8px;">
                <label for="geojsonInput" class="btn btn-primary" style="display:block; cursor:pointer; flex:1; text-align:center; padding:10px;">GeoJSON Yükle</label>
                <input type="file" id="geojsonInput" accept=".json,.geojson" hidden>
                <button id="loadSampleBtn" class="btn btn-secondary">Örnek Parsel</button>
            </div>
            <div class="grid-2">
                <div class="input-group"><label>Mahalle</label><input type="text" id="mahalleInput" value="-" readonly></div>
                <div class="input-group"><label>Ada / Parsel</label><input type="text" id="adaParselInput" value="-" readonly></div>
            </div>
        </div>

        <!-- 2. Kenar Cephe & Çekme Tanımları -->
        <div class="card">
            <h2>2. Kenar Cephe & Çekme Mesafeleri</h2>
            <div id="edgesList" style="max-height: 180px; overflow-y: auto;">
                <div style="color:var(--text-muted); text-align:center; font-size:11px;">Önce parsel yükleyin</div>
            </div>
            <button id="calculateBtn" class="btn btn-accent" disabled>Vaziyet Planını Çiz ve Hesapla</button>
        </div>

        <!-- 3. 2D Vaziyet Çizim Ekranı -->
        <div class="card">
            <h2>3. Ölçülü Vaziyet Planı</h2>
            <div class="canvas-box" id="canvasContainer">
                <canvas id="planCanvas"></canvas>
            </div>
        </div>

        <!-- 4. Alan Bilgileri -->
        <div class="card">
            <h2>Parsel & Yapı Alan Özeti</h2>
            <div class="summary-box">
                <span>Parsel Alanı: <strong id="parselAlanTxt">0 m²</strong></span>
                <span>Max Oturum (TAKS): <strong id="oturumAlanTxt">0 m²</strong></span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('planCanvas');
        const ctx = canvas.getContext('2d');

        let currentPolygon = null;
        let setbackPolygon = null;
        let edgesData = [];

        const sampleGeoJSON = {
            "type": "Feature",
            "properties": { "mahalle": "Şarköy Mah.", "ada": "142", "parsel": "8" },
            "geometry": {
                "type": "Polygon",
                "coordinates": [[
                    [26.9680, 39.4980],
                    [26.9688, 39.4981],
                    [26.9689, 39.4973],
                    [26.9681, 39.4972],
                    [26.9680, 39.4980]
                ]]
            }
        };

        function resizeCanvas() {
            const parent = document.getElementById('canvasContainer');
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            if (currentPolygon) drawVaziyet();
        }
        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        document.getElementById('loadSampleBtn').addEventListener('click', () => loadParcel(sampleGeoJSON));

        document.getElementById('geojsonInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const raw = JSON.parse(event.target.result);
                    let feat = raw.type === 'FeatureCollection' ? raw.features[0] : raw;
                    if (feat && feat.geometry) loadParcel(feat);
                    else alert("Geçersiz GeoJSON dosyası!");
                } catch(err) { alert("Dosya okunamadı!"); }
            };
            reader.readAsText(file);
        });

        function loadParcel(feature) {
            if (feature.geometry.type === 'MultiPolygon') {
                feature.geometry.type = 'Polygon';
                feature.geometry.coordinates = feature.geometry.coordinates[0];
            }
            currentPolygon = feature;
            setbackPolygon = null;

            const props = feature.properties || {};
            document.getElementById('mahalleInput').value = props.mahalle || props.MAHALLE || "Merkez";
            document.getElementById('adaParselInput').value = (props.ada || "1") + " / " + (props.parsel || "1");

            const coords = feature.geometry.coordinates[0];
            edgesData = [];
            for (let i = 0; i < coords.length - 1; i++) {
                const p1 = turf.point(coords[i]), p2 = turf.point(coords[i+1]);
                const lenMeters = turf.distance(p1, p2, {units: 'meters'});
                edgesData.push({
                    index: i,
                    length: lenMeters,
                    type: i === 0 ? 'yol' : 'komsu', // İlk kenar varsayılan yol
                    setback: i === 0 ? 5 : 3        // Yol 5m, Komşu 3m
                });
            }

            renderEdgesUI();
            document.getElementById('calculateBtn').disabled = false;
            
            const pArea = turf.area(currentPolygon);
            document.getElementById('parselAlanTxt').innerText = pArea.toFixed(1) + " m²";
            document.getElementById('oturumAlanTxt').innerText = (pArea * 0.4).toFixed(1) + " m²";

            drawVaziyet();
        }

        function renderEdgesUI() {
            const container = document.getElementById('edgesList');
            container.innerHTML = '';
            edgesData.forEach((edge, idx) => {
                const div = document.createElement('div');
                div.className = 'edge-row';
                div.innerHTML = `
                    <span><strong>K${idx+1}</strong> (${edge.length.toFixed(1)}m)</span>
                    <select onchange="updateEdge(${idx}, 'type', this.value)" style="background:#0f1115; color:white; border:1px solid var(--border); padding:4px; border-radius:4px;">
                        <option value="yol" ${edge.type==='yol'?'selected':''}>Yol (5m Çekme)</option>
                        <option value="komsu" ${edge.type==='komsu'?'selected':''}>Komşu (3m Çekme)</option>
                        <option value="bitisik" ${edge.type==='bitisik'?'selected':''}>Bitişik (0m)</option>
                    </select>
                    <input type="number" step="0.5" min="0" value="${edge.setback}" onchange="updateEdge(${idx}, 'setback', this.value)" style="background:#0f1115; color:white; border:1px solid var(--border); padding:4px; border-radius:4px; text-align:center;" title="Çekme (m)">
                `;
                container.appendChild(div);
            });
        }

        window.updateEdge = (idx, field, val) => {
            if (field === 'type') {
                edgesData[idx].type = val;
                edgesData[idx].setback = val === 'yol' ? 5 : (val === 'komsu' ? 3 : 0);
                renderEdgesUI();
            } else {
                edgesData[idx].setback = parseFloat(val) || 0;
            }
        };

        loadParcel(sampleGeoJSON);

        document.getElementById('calculateBtn').addEventListener('click', () => {
            if (!currentPolygon) return;
            try {
                const coords = currentPolygon.geometry.coordinates[0];
                const center = turf.center(currentPolygon).geometry.coordinates;
                const mLat = 111320, mLon = 111320 * Math.cos(center[1] * Math.PI / 180);

                let areaSum = 0;
                const localPts = coords.slice(0, -1).map(c => ({ x: (c[0] - center[0]) * mLon, y: (c[1] - center[1]) * mLat }));
                for (let i = 0; i < localPts.length; i++) {
                    const j = (i + 1) % localPts.length;
                    areaSum += (localPts[j].x - localPts[i].x) * (localPts[j].y + localPts[i].y);
                }
                const isClockwise = areaSum > 0;

                const offsetLines = localPts.map((p1, i) => {
                    const p2 = localPts[(i + 1) % localPts.length];
                    const dx = p2.x - p1.x, dy = p2.y - p1.y, len = Math.hypot(dx, dy);
                    if (len === 0) return { x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y };
                    const nx = isClockwise ? dy / len : -dy / len;
                    const ny = isClockwise ? -dx / len : dx / len;
                    const d = edgesData[i].setback;
                    return { x1: p1.x + nx * d, y1: p1.y + ny * d, x2: p2.x + nx * d, y2: p2.y + ny * d };
                });

                const newLocalPts = offsetLines.map((l2, i) => {
                    const l1 = offsetLines[(i - 1 + offsetLines.length) % offsetLines.length];
                    const denom = (l1.x1 - l1.x2) * (l2.y1 - l2.y2) - (l1.y1 - l1.y2) * (l2.x1 - l2.x2);
                    if (Math.abs(denom) < 1e-9) return { x: l2.x1, y: l2.y1 };
                    const t = ((l1.x1 - l2.x1) * (l2.y1 - l2.y2) - (l1.y1 - l2.y1) * (l2.x1 - l2.x2)) / denom;
                    return { x: l1.x1 + t * (l1.x2 - l1.x1), y: l1.y1 + t * (l1.y2 - l1.y1);
                });

                const newGeoCoords = newLocalPts.map(p => [center[0] + p.x / mLon, center[1] + p.y / mLat]);
                newGeoCoords.push(newGeoCoords[0]);

                setbackPolygon = turf.polygon([newGeoCoords]);
                
                const netArea = turf.area(setbackPolygon);
                if (netArea <= 0) {
                    alert("Girilen çekme mesafeleri çok büyük, bina alanı kalmadı!");
                    setbackPolygon = null;
                    return;
                }

                document.getElementById('oturumAlanTxt').innerText = netArea.toFixed(1) + " m²";
                drawVaziyet();
            } catch(e) {
                alert("Hesaplama hatası: " + e.message);
            }
        });

        function drawVaziyet() {
            if (!currentPolygon) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bbox = turf.bbox(currentPolygon);
            const padding = 45;
            const latFactor = Math.cos(((bbox[1] + bbox[3]) / 2) * Math.PI / 180);
            const spanX = (bbox[2] - bbox[0]) * latFactor || 0.001;
            const spanY = (bbox[3] - bbox[1]) || 0.001;
            const scale = Math.min((canvas.width - padding * 2) / spanX, (canvas.height - padding * 2) / spanY);
            const center = [(bbox[0] + bbox[2]) / 2, (bbox[1] + bbox[3]) / 2];

            function toScreen(coord) {
                return {
                    x: canvas.width / 2 + (coord[0] - center[0]) * latFactor * scale,
                    y: canvas.height / 2 - (coord[1] - center[1]) * scale
                };
            }

            const coords = currentPolygon.geometry.coordinates[0];

            // 1. Parsel Sınırlarını ve Kenar Etiketlerini Çiz
            for (let i = 0; i < coords.length - 1; i++) {
                const p1 = toScreen(coords[i]);
                const p2 = toScreen(coords[i+1]);
                const edge = edgesData[i];

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.lineWidth = edge.type === 'yol' ? 4 : 2.5;
                ctx.strokeStyle = edge.type === 'yol' ? '#3b82f6' : '#f59e0b'; // Yol Mavi, Komşu Turuncu
                ctx.stroke();

                // Kenar uzunluğu ve tip yazısı
                const midX = (p1.x + p2.x) / 2;
                const midY = (p1.y + p2.y) / 2;
                ctx.fillStyle = "#ffffff";
                ctx.font = "10px sans-serif";
                ctx.fillText(`K${i+1}: ${edge.length.toFixed(1)}m (${edge.type === 'yol' ? 'Yol 5m' : 'Komşu 3m'})`, midX - 30, midY - 5);
            }

            // 2. Çekme Sınırı / Bina Oturum Alanı (Yeşil)
            if (setbackPolygon) {
                const sCoords = setbackPolygon.geometry.coordinates[0];
                const screenPts = sCoords.map(toScreen);

                ctx.beginPath();
                screenPts.forEach((pt, i) => i === 0 ? ctx.moveTo(pt.x, pt.y) : ctx.lineTo(pt.x, pt.y));
                ctx.closePath();
                ctx.fillStyle = "rgba(16, 185, 129, 0.25)";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#10b981";
                ctx.stroke();

                // Merkezine "BİNA OTURUM ALANI" yazısı
                const bBox = turf.bbox(setbackPolygon);
                const bCenter = toScreen([(bBox[0]+bBox[2])/2, (bBox[1]+bBox[3])/2]);
                ctx.fillStyle = "#10b981";
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("BİNA OTURUM ALANI", bCenter.x, bCenter.y);
                ctx.textAlign = "left";
            }
        }
    </script>
</body>
</html>
